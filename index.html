<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Fix for "Cannot set property fetch of #<Window> which has only a getter"
      // Ensures window.fetch has both getter and setter in iframe sandboxes
      (function() {
        try {
          var _currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _currentFetch;
            },
            set: function(val) {
              _currentFetch = val;
            }
          });
        } catch (e) {
          try {
            Object.defineProperty(Window.prototype, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() {
                return _currentFetch;
              },
              set: function(val) {
                _currentFetch = val;
              }
            });
          } catch (err) {}
        }

        // Global safety error suppressor for benign window.fetch getter errors
        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf('fetch') !== -1 && event.message.indexOf('getter') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
